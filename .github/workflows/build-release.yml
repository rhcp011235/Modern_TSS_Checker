name: Build & Release

# Triggers on every push to main, or manually via the Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  # ── macOS: universal binary (Apple Silicon + Intel in one .app) ─────────────
  build-macos:
    name: Build macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller requests

      - name: Build universal .app bundle
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --target-arch universal2 \
            --name "TSS Checker" \
            tsschecker_GUI.py

      - name: Zip .app for distribution
        run: cd dist && zip -r "../TSS_Checker_macOS_universal.zip" "TSS Checker.app"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: TSS_Checker_macOS_universal.zip


  # ── Windows: single .exe, no console window ─────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller requests

      - name: Build Windows executable
        run: pyinstaller --onefile --windowed --name "TSS_Checker_Windows" tsschecker_GUI.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/TSS_Checker_Windows.exe


  # ── Linux x86_64: single binary ─────────────────────────────────────────────
  # ubuntu-22.04 gives better glibc compatibility than ubuntu-24.04
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tkinter system library
        run: sudo apt-get update -q && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: pip install pyinstaller requests

      - name: Build Linux binary
        run: |
          pyinstaller \
            --onefile \
            --hidden-import tkinter \
            --name "TSS_Checker_Linux_x86_64" \
            tsschecker_GUI.py

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/TSS_Checker_Linux_x86_64


  # ── Publish rolling "latest" release ─────────────────────────────────────────
  # Only runs after all three builds succeed.
  # Deletes the previous "latest" release + tag, then creates a fresh one.
  release:
    name: Publish release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Each artifact lands in artifacts/<name>/<file>

      - name: Show artifact tree (debug)
        run: find artifacts -type f

      - name: Delete existing "latest" release and tag
        run: gh release delete latest --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create new "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          DATE="$(date -u +'%Y-%m-%d')"

          gh release create latest \
            --latest \
            --title "Latest Build — ${DATE} (${SHORT})" \
            --notes "## TSS Checker

Automatically built from commit [\`${SHORT}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) on ${DATE}.

### Downloads

| Platform | File | Notes |
|----------|------|-------|
| macOS (Apple Silicon + Intel) | \`TSS_Checker_macOS_universal.zip\` | Universal binary — works on both M-series and Intel Macs |
| Windows | \`TSS_Checker_Windows.exe\` | Windows 10/11 x86_64 |
| Linux | \`TSS_Checker_Linux_x86_64\` | x86_64, built on Ubuntu 22.04 (glibc 2.35+) |

---

### macOS — first launch

macOS will block unsigned apps from the internet. To open:

1. Unzip, then double-click \`TSS Checker.app\`
2. If blocked: open **System Settings → Privacy & Security** and click **Open Anyway**
   (or right-click the .app → **Open**)

### Linux

\`\`\`bash
chmod +x TSS_Checker_Linux_x86_64
./TSS_Checker_Linux_x86_64
\`\`\`

---

Only dependency is **Python + requests** — already bundled, no install needed." \
            "artifacts/macos/TSS_Checker_macOS_universal.zip" \
            "artifacts/windows/TSS_Checker_Windows.exe" \
            "artifacts/linux/TSS_Checker_Linux_x86_64"
